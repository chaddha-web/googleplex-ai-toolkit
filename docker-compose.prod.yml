# ─────────────────────────────────────────────────────────────────────────
# Production compose — single Lightsail VPS
#
# Services:
#   traefik  → :80 / :443 reverse proxy with auto Let's Encrypt
#   landing  → ggakingclub.com
#   web      → app.ggakingclub.com
#   admin    → admin.ggakingclub.com
#   auth     → auth.ggakingclub.com  (services/auth)
#   wallet   → wallet.ggakingclub.com (services/wallet)
#
# Volumes:
#   auth-data    — services/auth/data (SQLite)
#   wallet-data  — services/wallet/data (SQLite)
#   letsencrypt  — Traefik cert cache
#
# All secrets come from .env.prod (NOT in git). See .env.prod.example.
# ─────────────────────────────────────────────────────────────────────────

services:
  traefik:
    image: traefik:v3.5
    container_name: gplex-traefik
    restart: unless-stopped
    environment:
      # Docker 29 daemon rejects API <1.40; pin client to a modern version.
      - DOCKER_API_VERSION=1.45
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Default network Traefik dials backends on; wallet overrides to backend
      # via its own traefik.docker.network label (it is not on the frontend net).
      - --providers.docker.network=gplex-frontend
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Auto-redirect HTTP → HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    # Traefik sits on BOTH tiers so it can route to frontend + backend services.
    networks:
      - frontend-net
      - backend-net

  landing:
    build:
      context: .
      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
      # MUST be passed as build args (runtime `environment:` is too late). This
      # single build produces the shared image for landing, web, and admin —
      # all three use the same auth/wallet origins.
      args:
        NEXT_PUBLIC_AUTH_BASE: https://auth.${DOMAIN}
        NEXT_PUBLIC_WALLET_BASE: https://wallet.${DOMAIN}
        NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_LANDING_URL: https://${DOMAIN}
        NEXT_PUBLIC_GOV_BASE: https://gov.${DOMAIN}
    image: gplex-monorepo:latest
    container_name: gplex-landing
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - PORT=3010
      - NEXT_PUBLIC_AUTH_BASE=https://auth.${DOMAIN}
      - NEXT_PUBLIC_WALLET_BASE=https://wallet.${DOMAIN}
      - NEXT_PUBLIC_WEB_URL=https://app.${DOMAIN}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
    command: ["npm", "run", "start", "--workspace", "@googolplex/landing"]
    expose:
      - "3010"
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=le
      - traefik.http.services.landing.loadbalancer.server.port=3010
      # The real admin panel is served by this same landing app at /app/admin.
      # admin.${DOMAIN} routes here (a middleware sends the subdomain root to
      # /app/admin/overview). The old mock apps/admin container is retired.
      - traefik.http.routers.adminpanel.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.adminpanel.entrypoints=websecure
      - traefik.http.routers.adminpanel.tls.certresolver=le
      - traefik.http.routers.adminpanel.service=landing
      - traefik.docker.network=gplex-frontend
    networks:
      - frontend-net
    depends_on:
      - auth

  web:
    image: gplex-monorepo:latest
    container_name: gplex-web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - PORT=3000
      - NEXT_PUBLIC_AUTH_BASE=https://auth.${DOMAIN}
      - NEXT_PUBLIC_WALLET_BASE=https://wallet.${DOMAIN}
      - NEXT_PUBLIC_LANDING_URL=https://${DOMAIN}
      # AI-Studio-published member sites live on a persisted volume so they
      # survive redeploys (the container filesystem is otherwise ephemeral).
      - PUBLISHED_SITES_DIR=/data/published-sites
    command: ["npm", "run", "start", "--workspace", "@googolplex/web"]
    volumes:
      - ./web-published-sites:/data/published-sites
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000
      - traefik.docker.network=gplex-frontend
    networks:
      - frontend-net
    depends_on:
      - landing

  # NOTE: the old `admin` service (apps/admin — a shadcn mock Operator UI on
  # :3001) was retired. The real admin panel is served by the landing app at
  # /app/admin, and admin.${DOMAIN} now routes to landing (see its labels).

  auth:
    image: gplex-monorepo:latest
    container_name: gplex-auth
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - PORT=4200
      - AUTH_DB_PATH=/data/auth.db
      - CORS_ORIGINS=https://${DOMAIN},https://app.${DOMAIN},https://admin.${DOMAIN}
      # Profile images are written here (shared with the media nginx below) and
      # served at https://${DOMAIN}/media/avatars/*.
      - AVATAR_DIR=/srv/media/avatars
      - AVATAR_BASE_URL=https://${DOMAIN}/media/avatars
      # Admin uploads (orientation video, dashboard background) — same shared
      # media dir, served by the nginx `media` container below. nginx does the
      # byte-range + caching work a long video needs; Node never streams it.
      - UPLOAD_DIR=/srv/media/uploads
      - UPLOAD_BASE_URL=https://${DOMAIN}/media/uploads
    command: ["npx", "tsx", "services/auth/src/server.ts"]
    expose:
      - "4200"
    volumes:
      - auth-data:/data
      # Same host dir the media nginx serves — auth writes avatars, nginx serves.
      - ./media:/srv/media
    labels:
      - traefik.enable=true
      # /internal/* must never be reachable from the public internet (it returns
      # decrypted keys etc.). Service-to-service calls use internal DNS
      # (http://auth:4200) and bypass Traefik, so excluding it here is safe.
      - traefik.http.routers.auth.rule=Host(`auth.${DOMAIN}`) && !PathPrefix(`/internal`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=le
      - traefik.http.services.auth.loadbalancer.server.port=4200
      - traefik.docker.network=gplex-frontend
    # auth is dual-homed: the frontend tier (landing/web) calls it, AND wallet
    # calls it from the backend tier. It is the only shared service.
    networks:
      - frontend-net
      - backend-net

  wallet:
    image: gplex-monorepo:latest
    container_name: gplex-wallet
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - PORT=4201
      - WALLET_DB_PATH=/data/wallet.db
      - WALLET_SEED_DIR=/data/seeds
      - AUTH_BASE_URL=http://auth:4200
      - CORS_ORIGINS=https://${DOMAIN},https://app.${DOMAIN},https://admin.${DOMAIN}
    command: ["npx", "tsx", "services/wallet/src/server.ts"]
    expose:
      - "4201"
    volumes:
      - wallet-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.wallet.rule=Host(`wallet.${DOMAIN}`) && !PathPrefix(`/internal`)
      - traefik.http.routers.wallet.entrypoints=websecure
      - traefik.http.routers.wallet.tls.certresolver=le
      - traefik.http.services.wallet.loadbalancer.server.port=4201
      # wallet lives ONLY on the backend tier — unreachable from landing/web/media.
      # Traefik reaches it via the backend net (override of the frontend default).
      - traefik.docker.network=gplex-backend
    networks:
      - backend-net
    depends_on:
      - auth

  # Static media server — serves large files (e.g. the full-size render video)
  # from the host ./media dir at https://${DOMAIN}/media/*. Kept out of the app
  # image so a 1.5GB video never bloats the Docker build. Higher Traefik
  # priority than the landing router so /media wins the path match.
  media:
    image: nginx:1.27-alpine
    container_name: gplex-media
    restart: unless-stopped
    volumes:
      - ./media:/usr/share/nginx/html/media:ro
      # Long-lived cache headers for /media/* (incl. 206 range responses) so
      # videos load from disk cache on back-navigation instead of re-fetching.
      - ./infra/media/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/media`)
      - traefik.http.routers.media.priority=100
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls.certresolver=le
      - traefik.http.services.media.loadbalancer.server.port=80
      - traefik.docker.network=gplex-frontend
    networks:
      - frontend-net

volumes:
  auth-data:
  wallet-data:
  letsencrypt:

# Micro-segmentation: the fund-moving wallet service sits on backend-net only,
# isolated from the internet-facing landing/web/media tier. auth is dual-homed
# (both tiers legitimately call it); Traefik straddles both to route ingress.
networks:
  frontend-net:
    name: gplex-frontend
    driver: bridge
  backend-net:
    name: gplex-backend
    driver: bridge
