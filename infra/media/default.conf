# Media server (gplex-media) — replaces nginx:alpine's stock default.conf.
#
# Adds long-lived cache headers so the hero/sidebar videos are served from the
# browser's disk cache on repeat visits and back-navigation, instead of being
# re-fetched every time (which re-ran the slow-load race and made the hero
# "sometimes show, sometimes not").

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Media is versioned by filename — to change an asset we swap the file AND
    # bump its name in lib/assets.ts — so it's safe to cache forever.
    #
    # `always` is the critical bit: <video> is delivered as 206 partial (range)
    # responses, and a plain add_header is skipped on 206. Without `always` the
    # Cache-Control never reached the browser, so the video kept re-downloading.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        access_log off;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Nothing else is served from this host.
    location / {
        return 404;
    }
}
